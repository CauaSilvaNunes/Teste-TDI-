<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testes psicológicos</title>
  <meta name="description" content="Plataforma de avaliação neuropsicológica com testes de Atenção Concentrada, Dividida e Alternada baseados na metodologia de Fabián Javier." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="apple-touch-icon" href="icon.svg" />
</head>
<body>
  <div id="app">
    <!-- Components rendered by JS -->
  </div>

  <script src="figuras.js"></script>
  <script src="tedif2.js"></script>
  <script src="tedif3.js"></script>
  <script src="app.js"></script>

  <!-- Registrando o Service Worker (PWA Offline) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registrado com sucesso!', reg))
          .catch(err => console.error('Erro ao registrar Service Worker:', err));
      });
    }
  </script>
</body>
